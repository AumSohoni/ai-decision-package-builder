[project]
name = "ai-decision-package-builder"
version = "0.1.0"
description = "AI prepares structured decision packages; humans decide."
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]